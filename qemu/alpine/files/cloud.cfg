cloud_init_modules:
 - bootcmd
 - write_files
 - ssh
 - set_hostname
 - update_etc_hosts # Ensure /etc/hosts is updated with the new hostname by manage_etc_hosts

cloud_config_modules:
 - runcmd
 - set_passwords
 - timezone

cloud_final_modules:
 - scripts-per-once
 - scripts-per-boot
 - scripts-per-instance
 - scripts-user
 - phone-home
 - ssh-authkey-fingerprints

system_info:
  distro: alpine
  paths:
    cloud_dir: /var/lib/cloud
    templates_dir: /etc/cloud/templates
  ssh_svcname: sshd

ssh_deletekeys: True
ssh_genkeytypes: ['ecdsa', 'ed25519']

datasource_list:
  - NoCloud
