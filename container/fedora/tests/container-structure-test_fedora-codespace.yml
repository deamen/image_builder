schemaVersion: 2.0.0

metadataTest:
  entrypoint: []
  cmd:
    - '/bin/bash'
    - '--login'
  user: 'deamen'
  workdir: '/home/deamen'
  labels:
    - key: 'org.opencontainers.image.title'
      value: 'fedora-codespace'
    - key: 'org.opencontainers.image.source'
      value: 'https://github.com/deamen/image_builder'

fileExistenceTests:
  - name: 'ansible binary'
    path: '/usr/bin/ansible'
    shouldExist: true
  - name: 'pipx binary'
    path: '/usr/bin/pipx'
    shouldExist: true
  - name: 'detect-secrets installed via pipx for deamen'
    path: '/home/deamen/.local/bin/detect-secrets'
    shouldExist: true
  - name: 'molecule installed via pipx for deamen'
    path: '/home/deamen/.local/bin/molecule'
    shouldExist: true
  - name: 'deamen.ansible collection installed system-wide'
    path: '/usr/share/ansible/collections/ansible_collections/deamen/ansible'
    shouldExist: true
  - name: 'deamen.general collection installed as dependency'
    path: '/usr/share/ansible/collections/ansible_collections/deamen/general'
    shouldExist: true
  - name: 'deamen.proton collection installed system-wide'
    path: '/usr/share/ansible/collections/ansible_collections/deamen/proton'
    shouldExist: true
  - name: 'Proton Drive CLI environment deployed by deamen.proton.install_proton_drive_cli'
    path: '/home/deamen/.bashrc.d/proton_drive_cli.sh'
    shouldExist: true
    uid: 1000
    permissions: '-rw-r--r--'
  - name: 'Proton Pass CLI environment deployed by deamen.proton.install_proton_pass_cli'
    path: '/home/deamen/.bashrc.d/proton_pass_cli.sh'
    shouldExist: true
    uid: 1000
    permissions: '-rw-r--r--'
  - name: 'Prj directory created by playbook'
    path: '/home/deamen/Prj'
    shouldExist: true
    uid: 1000
    permissions: 'drwx------'
  - name: 'Ref directory created by playbook'
    path: '/home/deamen/Ref'
    shouldExist: true
    uid: 1000
  - name: 'GPG home created by deamen.gpg.configure_gpg_for_user'
    path: '/home/deamen/.gnupg'
    shouldExist: true
    uid: 1000
    permissions: 'drwx------'
  - name: 'gpg-agent.conf deployed by deamen.gpg.configure_gpg_for_user'
    path: '/home/deamen/.gnupg/gpg-agent.conf'
    shouldExist: true
    uid: 1000
    permissions: '-rw-------'
  - name: 'himalaya config.toml deployed by deamen.general.install_himalaya'
    path: '/home/deamen/.config/himalaya/config.toml'
    shouldExist: true
    uid: 1000
    permissions: '-rw-------'
  - name: 'ansible vault stub deployed by playbook'
    path: '/home/deamen/.ansible_vault.yml'
    shouldExist: true
    uid: 1000
    permissions: '-rw-------'

fileContentTests:
  - name: 'git prompt helper installed'
    path: '/home/deamen/.bashrc.d/load_git-prompt.sh'
    expectedContents: ['git-prompt']
  - name: 'dev aliases deployed by playbook'
    path: '/home/deamen/.bashrc.d/aliases.sh'
    expectedContents: ['alias prj=']
  - name: 'gpg-agent cache TTLs are 2 hours default and 12 hours max'
    path: '/home/deamen/.gnupg/gpg-agent.conf'
    expectedContents: ['default-cache-ttl 7200', 'max-cache-ttl 43200']
  - name: 'himalaya password is read with gpg_cat.sh'
    path: '/home/deamen/.config/himalaya/config.toml'
    expectedContents: ['password.command = "/usr/local/bin/gpg_cat.sh --gpg_file /home/deamen/.config/himalaya/selfhosted.gpg"']
  - name: 'Proton Drive CLI stores credentials in a file'
    path: '/home/deamen/.bashrc.d/proton_drive_cli.sh'
    expectedContents: ['export PROTON_DRIVE_CREDENTIALS_STORE=unsafe_file']
  - name: 'Proton Pass CLI stores its session key in a file'
    path: '/home/deamen/.bashrc.d/proton_pass_cli.sh'
    expectedContents: ['export PROTON_PASS_KEY_PROVIDER=fs']

commandTests:
  - name: 'ansible version'
    command: 'ansible'
    args: ['--version']
    expectedOutput: ['ansible']
  - name: 'podman version'
    command: 'podman'
    args: ['--version']
    expectedOutput: ['podman version']
  - name: 'Copilot CLI installed for deamen'
    command: 'bash'
    args: ['-lc', 'command -v copilot']
    expectedOutput: ['/home/deamen/.local/bin/copilot']
  - name: 'himalaya installed for deamen'
    command: 'bash'
    args: ['-lc', 'command -v himalaya']
    expectedOutput: ['/home/deamen/.local/bin/himalaya']
  - name: 'Proton Drive CLI installed for deamen'
    command: 'bash'
    args: ['-lc', 'command -v proton-drive']
    expectedOutput: ['/home/deamen/.local/bin/proton-drive']
  - name: 'PROTON_DRIVE_CREDENTIALS_STORE set in login shells'
    command: 'bash'
    args: ['-lc', 'echo $PROTON_DRIVE_CREDENTIALS_STORE']
    expectedOutput: ['unsafe_file']
  - name: 'Proton Pass CLI installed for deamen'
    command: 'bash'
    args: ['-lc', 'command -v pass-cli']
    expectedOutput: ['/home/deamen/.local/bin/pass-cli']
  - name: 'PROTON_PASS_KEY_PROVIDER set in login shells'
    command: 'bash'
    args: ['-lc', 'echo $PROTON_PASS_KEY_PROVIDER']
    expectedOutput: ['fs']
  - name: 'linear-cli version'
    command: 'linear'
    args: ['--version']
    expectedOutput: ['linear [0-9]']
  - name: 'gpg installed'
    command: 'gpg'
    args: ['--version']
    expectedOutput: ['GnuPG']
  - name: 'no GPG secret keys baked into the image'
    command: 'gpg'
    args: ['--list-secret-keys', '--with-colons']
    excludedOutput: ['sec:']
  - name: 'expected packages installed'
    command: 'rpm'
    args: ['-q', 'ansible', 'openssh-clients', 'git', 'sudo']
    expectedOutput: ['ansible', 'openssh-clients', 'git', 'sudo']
  - name: 'dev packages installed by playbook'
    command: 'rpm'
    args: ['-q', 'gh', 'jq', 'tmux', 'vim-enhanced']
    expectedOutput: ['gh', 'jq', 'tmux', 'vim-enhanced']
  - name: 'VS Code server prerequisites installed'
    command: 'rpm'
    args: ['-q', 'tar', 'gzip', 'procps-ng', 'which']
    expectedOutput: ['tar', 'gzip', 'procps-ng', 'which']
  - name: 'git prompt loaded in login shell'
    command: 'bash'
    args: ['-lc', 'type -t __git_ps1']
    expectedOutput: ['function']
  - name: 'prj alias available in login shell'
    command: 'bash'
    args: ['-lc', 'alias prj']
    expectedOutput: ['alias prj=']
