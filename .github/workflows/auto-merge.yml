name: Enable Auto-Merge for Owner PRs

# Turns on GitHub's native auto-merge for PRs opened by the repo owner, so GitHub
# itself merges the PR once every required status check on master has passed.
# Branch cleanup and the image publish after the merge are done by
# merged-owner-pr-cleanup.yml, which runs on a schedule, so this job does not
# have to stay alive until the merge happens.
#
# Requires, in the repository settings:
#   - General -> "Allow auto-merge" enabled
#   - General -> "Allow rebase merging" enabled
#   - A ruleset on master with the required status checks: "pre-commit.ci - pr"
#     and "container-ci" (the gate job in container-ci.yml, which covers every
#     image, so adding an image needs no ruleset change). Other checks added
#     later must be added to the ruleset by name. Without a required check there
#     is nothing to wait for and the PR is merged immediately.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: write
    # Only same-repo, non-draft PRs opened by the repo owner
    if: >
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Required so gh CLI knows the target repo without a checkout step
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # --rebase (not --squash) keeps every PR commit, replayed onto master
      # without a merge commit
      - name: Enable auto-merge
        run: gh pr merge --auto --rebase "$PR_NUMBER"
