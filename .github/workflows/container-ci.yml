name: Container CI

# Builds container images, runs their tests (everything in container/fedora/tests whose make
# target ends in -<image>), and publishes them to quay.io.
#
# - pull_request: builds and tests the images the PR changes, amd64 only. Nothing is pushed.
# - push to master: builds and tests the images the push changes for amd64 and arm64, each on a
#   native runner, pushes them as quay.io/deamen/<image>:latest-<arch>, then combines them into
#   the multi-arch quay.io/deamen/<image>:latest.
# - schedule (weekly) and workflow_dispatch: the same for every image. The weekly rebuild picks
#   up Fedora updates and the unpinned deamen collections in fedora-codespace. A manual run on a
#   branch other than master builds and tests both arches but doesn't push.
#   workflow_dispatch with a base commit only handles the images changed since it. auto-merge.yml
#   starts that after each merge, because the push of a merge made with GITHUB_TOKEN doesn't
#   trigger workflows.
#
# The images, and the files that rebuild each one, are listed in .github/container-images.yml.
#
# Only the "container-ci" job is a required status check on master. Do not add a
# workflow-level paths: filter: a workflow that never runs never reports its
# required check, and the PR stays blocked. Changed images are detected in the
# "changes" job instead, and skipped "build" and "publish" jobs count as passing.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      base:
        description: 'Only build the images changed since this commit (default: every image)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.event.pull_request.number || github.ref }}
  # Supersede outdated PR runs, but never cancel a publish halfway through
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Push only from master, and never from a PR
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists the PR's files through the API
      pull-requests: read
    outputs:
      images: ${{ steps.images.outputs.images }}
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      # The filters file, and on push the commit range to compare
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push' || inputs.base != ''
        with:
          filters: .github/container-images.yml
          # Empty except on workflow_dispatch with a base, so the other events keep their default
          base: ${{ inputs.base }}

      # Builds every selected image for each arch on a native runner: amd64 only on PRs
      - name: Select images
        id: images
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ] || [ -n "$BASE" ]; then
            images=$CHANGED
          else
            images=$(yq -o=json -I=0 'keys' .github/container-images.yml)
          fi
          if [ "$EVENT" = pull_request ]; then
            arches='["amd64"]'
          else
            arches='["amd64","arm64"]'
          fi
          matrix=$(jq -cn --argjson images "$images" --argjson arches "$arches" '
            {include: [$images[] as $image | $arches[] as $arch | {
              image: $image,
              arch: $arch,
              runner: (if $arch == "arm64" then "ubuntu-24.04-arm" else "ubuntu-24.04" end)
            }]}')
          echo "Images: $images"
          echo "Matrix: $matrix"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.image }}, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE: quay.io/deamen/${{ matrix.image }}-${{ matrix.arch }}:latest
      CST_VERSION: v1.22.1
    steps:
      - uses: actions/checkout@v7.0.1

      # Native builds, so no qemu. podman runs the pytest checks and shares buildah's storage.
      - name: Install buildah and podman
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah podman
          # Rootless buildah needs subordinate ids for the runner user
          user=$(id -un)
          if ! grep -q "^${user}:" /etc/subuid; then
            echo "${user}:100000:65536" | sudo tee -a /etc/subuid /etc/subgid
          fi

      # Every other image is built FROM the local fedora-init-${ARCH} (INIT_IMAGE
      # in fedora_vars.sh), which is never published, so always build it first
      - name: Build fedora-init
        run: ./container/fedora/buildah_fedora-init.sh

      - name: Build ${{ matrix.image }}
        if: matrix.image != 'fedora-init'
        run: ./container/fedora/buildah_${{ matrix.image }}.sh

      - name: Install container-structure-test
        env:
          CST_SHA256: ${{ matrix.arch == 'arm64' && '801826ed107222120eb6df8c143b7de752cfebbe3aebfeea576e7098486917c2' || 'fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca' }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o container-structure-test \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-${ARCH}"
          echo "${CST_SHA256}  container-structure-test" | sha256sum -c -
          sudo install -m 0755 container-structure-test /usr/local/bin/
          rm container-structure-test

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest pytest-testinfra

      # container-structure-test runs images through the Docker daemon, while
      # buildah builds into containers-storage
      - name: Copy the image to the Docker daemon
        run: buildah push "$IMAGE" "docker-daemon:$IMAGE"

      - name: Test ${{ matrix.image }}
        working-directory: container/fedora/tests
        run: |
          mapfile -t targets < <(make --no-print-directory list-tests | grep -- "-${{ matrix.image }}$")
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::No tests found for ${{ matrix.image }}"
            exit 1
          fi
          make "${targets[@]}" IMAGE="$IMAGE"

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        env:
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER }}
        run: |
          echo "$REGISTRY_PASSWORD" | buildah login \
            --username "$REGISTRY_USERNAME" --password-stdin "$REGISTRY_SERVER"

      # Push this arch on its own tag and record its digest, so the publish job combines exactly
      # the images built in this run
      - name: Push ${{ matrix.image }}:latest-${{ matrix.arch }}
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          buildah push --digestfile "digests/${{ matrix.image }}-${ARCH}" \
            "$IMAGE" "docker://quay.io/deamen/${{ matrix.image }}:latest-${ARCH}"
          cat "digests/${{ matrix.image }}-${ARCH}"

      - uses: actions/upload-artifact@v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/${{ matrix.image }}-${{ matrix.arch }}
          retention-days: 1

  # Combines the per-arch images of each image into quay.io/deamen/<image>:latest. Runs per image
  # even if another image failed, but only if both arches of this image were pushed in this run.
  publish:
    needs: [changes, build]
    if: >
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' &&
      needs.changes.result == 'success' && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true

      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Log in to the registry
        env:
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER }}
        run: |
          echo "$REGISTRY_PASSWORD" | buildah login \
            --username "$REGISTRY_USERNAME" --password-stdin "$REGISTRY_SERVER"

      - name: Push the multi-arch manifest
        run: |
          repo="quay.io/deamen/${{ matrix.image }}"
          sources=()
          for arch in amd64 arm64; do
            file="digests/${{ matrix.image }}-${arch}"
            if [ ! -s "$file" ]; then
              echo "::error::${{ matrix.image }} ${arch} was not built and pushed in this run"
              exit 1
            fi
            sources+=("docker://${repo}@$(cat "$file")")
          done
          ./container/helper_scripts/buildah_multiarch.sh "$repo" "${sources[@]}"

  # The single required check. Fails if any job it needs failed or was cancelled;
  # skipped jobs (no image changed, or nothing to publish) count as passing.
  container-ci:
    if: always()
    needs: [changes, build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job finished with: $result"; exit 1 ;;
            esac
          done
