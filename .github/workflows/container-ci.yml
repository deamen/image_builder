name: Container CI

# Builds container images, runs their tests (everything in container/fedora/tests whose make
# target ends in -<image>), and publishes them to quay.io.
#
# - pull_request: builds and tests the images the PR changes, amd64 only. Nothing is pushed.
# - push to master: same for the images the push changes, plus an arm64 build and a push of the
#   multi-arch manifest to quay.io/deamen/<image>:latest.
# - schedule (weekly) and workflow_dispatch: every image, built, tested and pushed. The weekly
#   rebuild picks up Fedora updates and the unpinned deamen collections in fedora-codespace.
#   A manual run on a branch other than master builds both arches but doesn't push.
#   workflow_dispatch with a base commit only handles the images changed since it. auto-merge.yml
#   starts that after each merge, because the push of a merge made with GITHUB_TOKEN doesn't
#   trigger workflows.
#
# The images, and the files that rebuild each one, are listed in .github/container-images.yml.
#
# Only the "container-ci" job is a required status check on master. Do not add a
# workflow-level paths: filter: a workflow that never runs never reports its
# required check, and the PR stays blocked. Changed images are detected in the
# "changes" job instead, and a skipped "build" job counts as passing.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      base:
        description: 'Only build the images changed since this commit (default: every image)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.event.pull_request.number || github.ref }}
  # Supersede outdated PR runs, but never cancel a publish halfway through
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter lists the PR's files through the API
      pull-requests: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      # The filters file, and on push the commit range to compare
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push' || inputs.base != ''
        with:
          filters: .github/container-images.yml
          # Empty except on workflow_dispatch with a base, so the other events keep their default
          base: ${{ inputs.base }}

      - name: Select images
        id: images
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ] || [ -n "$BASE" ]; then
            images=$CHANGED
          else
            images=$(yq -o=json -I=0 'keys' .github/container-images.yml)
          fi
          echo "Images: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04
    # arm64 builds run under qemu emulation
    timeout-minutes: ${{ github.event_name == 'pull_request' && 90 || 240 }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      IMAGE: quay.io/deamen/${{ matrix.image }}-amd64:latest
      # PRs build and test amd64 only. Other runs also build arm64, and push only from master
      # (a manual run on another branch builds both arches without pushing)
      MULTIARCH: ${{ github.event_name != 'pull_request' }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      CST_VERSION: v1.22.1
      CST_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup buildah
        uses: deamen/gh-actions/setup-buildah@master
        with:
          os: 'ubuntu'

      # Every other image is built FROM the local fedora-init-${ARCH} (INIT_IMAGE
      # in fedora_vars.sh), which is never published, so always build it first
      - name: Build fedora-init (amd64)
        run: ARCH=amd64 ./container/fedora/buildah_fedora-init.sh

      - name: Build ${{ matrix.image }} (amd64)
        if: matrix.image != 'fedora-init'
        run: ARCH=amd64 ./container/fedora/buildah_${{ matrix.image }}.sh

      - name: Install container-structure-test
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o container-structure-test \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-amd64"
          echo "${CST_SHA256}  container-structure-test" | sha256sum -c -
          sudo install -m 0755 container-structure-test /usr/local/bin/
          rm container-structure-test

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      # The pytest checks build and run their own containers with podman, which
      # is preinstalled on the runner and shares buildah's image storage
      - name: Install pytest
        run: pip install pytest pytest-testinfra

      # container-structure-test runs images through the Docker daemon, while
      # buildah builds into containers-storage
      - name: Copy the image to the Docker daemon
        run: buildah push "$IMAGE" "docker-daemon:$IMAGE"

      - name: Test ${{ matrix.image }}
        working-directory: container/fedora/tests
        run: |
          mapfile -t targets < <(make --no-print-directory list-tests | grep -- "-${{ matrix.image }}$")
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::No tests found for ${{ matrix.image }}"
            exit 1
          fi
          make "${targets[@]}" IMAGE="$IMAGE"

      # Only the amd64 image is tested; arm64 is built and published after it passes
      - name: Free the Docker copy
        if: env.MULTIARCH == 'true'
        run: docker rmi "$IMAGE"

      - name: Build fedora-init (arm64)
        if: env.MULTIARCH == 'true'
        run: ARCH=arm64 ./container/fedora/buildah_fedora-init.sh

      - name: Build ${{ matrix.image }} (arm64)
        if: env.MULTIARCH == 'true' && matrix.image != 'fedora-init'
        run: ARCH=arm64 ./container/fedora/buildah_${{ matrix.image }}.sh

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        env:
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER }}
        run: |
          echo "$REGISTRY_PASSWORD" | buildah login \
            --username "$REGISTRY_USERNAME" --password-stdin "$REGISTRY_SERVER"

      - name: Push the multi-arch manifest
        if: env.PUBLISH == 'true'
        run: ./container/helper_scripts/buildah_multiarch.sh "quay.io/deamen/${{ matrix.image }}"

  # The single required check. Fails if any job it needs failed or was cancelled;
  # skipped jobs (no image changed) count as passing.
  container-ci:
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job finished with: $result"; exit 1 ;;
            esac
          done
